[project]
name = "cs285-final-project"
version = "0.1.0"
description = "Minimal bootstrap for the CS285 final project"
requires-python = ">=3.11"
dependencies = [
  "torch",
  "pyyaml",
  "matplotlib",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
